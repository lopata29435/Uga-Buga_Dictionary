<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Base динамически вставляется, если не root -->
    <script type="module">
      const base = import.meta.env.BASE_URL || '/';
      if (!document.querySelector('base')) {
        const b = document.createElement('base');
        b.href = base;
        document.head.prepend(b);
      }
    </script>
    <!-- Относительные favicon (работают в подпапке) -->
    <link id="favicon-main" rel="icon" type="image/svg+xml" href="hammer.svg?v=3" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Uga-Buga</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="src/main.jsx"></script>
  </body>
</html>
