api:
  version: ${API_VERSION:v1}

jwt:
  secret: ${JWT_SECRET:tolsty}
  access:
    expiry: ${JWT_ACCESS_EXPIRY:900000}
  refresh:
    expiry: ${JWT_REFRESH_EXPIRY:604800000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  show-actuator: false

spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dictionary_db}
    username: ${SPRING_DATASOURCE_USERNAME:dictionary_user}
    password: ${SPRING_DATASOURCE_PASSWORD:dictionary_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
